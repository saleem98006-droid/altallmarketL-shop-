name: TM_shop
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.2+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  url_launcher: ^6.2.5
  http: ^1.2.0
  intl: ^0.20.2          # آخر إصدار
  firebase_core: ^4.2.1
  flutter_map: ^8.2.2
  fluttertoast: ^9.0.0
  unicode: ^0.3.1 
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1
  go_router: ^14.2.0
  tutorial_coach_mark: ^1.2.13
  google_maps_flutter: ^2.5.0
  location: ^8.0.1
  latlong2: ^0.9.0
  permission_handler: ^12.0.1
  animated_text_kit: ^4.2.2
  geocoding: ^4.0.0
  shimmer: ^3.0.0
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0
  sqflite: ^2.3.0
  path: ^1.9.0
  infinite_scroll_pagination: ^5.1.1
  video_player: ^2.7.0
  flutter_image_compress: ^2.1.0
  cached_network_image: ^3.3.0
  dio: ^5.4.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app.png"   # ← ضع مسار الأيقونة

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/data/tall_boundary.geojson
    - assets/videos/


  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: VladiirScript
      fonts:
        - asset: assets/fonts/vladimir_script_regular.ttf